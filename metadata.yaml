name: astrbot_plugin_selfie
display_name: 大肥鱼的自拍
short_desc: 聊天里她自己判断要不要拍照，自己写提示词，调用本地 ComfyUI 出图
desc: |-
  让大肥鱼在聊天中有画面感的时候，自己决定拍一张。

  判断交给她自己：每攒够若干条消息，她读一遍上下文，判断这轮有没有值得拍的画面
  （在吃什么、去了哪、什么天气、什么心情），有就自己写一条完整英文提示词，
  交给本地 ComfyUI + 她的专属 LoRA 出图，再把图发出来。

  两个开关决定边界：群聊里发不发、LoRA 用第几档、权重多少，都在配置里调。
  出图之后同一轮不再补表情包，免得一图一包刷屏。

  空间联动：主人点单发说说时可以让她顺手配一张自己画的图，画面由主人指定。
help: |-
  【指令】
  /自拍　　　　让她现在拍一张（不受冷却限制）
  /自拍 全身 水手服　　/ 后面跟要求，她照做：景别、服装、地点、动作都能写
  /自拍状态　　看档位、权重、群聊开关、冷却、累计张数
  /自拍帮助　　这一条

  【她会看上下文】
  就算只发 /自拍，她也会先翻最近聊天（默认 16 条）：
  聊过「去河边穿JK」，就画成在河边穿JK；聊过下雨，就画窗边的雨。
  带了要求时要求优先，没说要求才从聊天里取。

  【只用指令（默认）】
  现在默认不自动拍图：平时聊天不会突然发照片，也不会影响表情包。
  想让她自己判断什么时候拍，去配置里把「自动判断」打开。

  【自动触发（打开后生效）】
  每 selfie_check_every 条消息（默认 10）她读一遍最近聊天，
  判断有没有画面感；有就自己写提示词出图。
  两次之间至少隔 cooldown_minutes（默认 30 分钟），
  判断成立后还有 send_probability（默认 0.8）的概率真的发。

  【配置】
  面板 → 插件 → 大肥鱼的自拍 → 配置
  ①②主人 / 机器人的 QQ 号（必填①）
  ③群聊里允不允许生成图片（默认关）
  ④用第几档 LoRA（默认 12）　⑤权重（默认 0.7）
  ⑥生图接口地址（默认 http://127.0.0.1:8190）
